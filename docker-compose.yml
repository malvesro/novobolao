services:
  db:
    image: mysql:8.0
    container_name: bolao-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bolao
      MYSQL_USER: user_bolao
      MYSQL_PASSWORD: pass_bolao
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - bolao-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: bolao-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_NAME=bolao
      - DB_USER=user_bolao
      - DB_PASS=pass_bolao
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bolao-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  bolao-net:
    driver: bridge

volumes:
  db_data:
