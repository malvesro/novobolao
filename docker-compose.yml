services:
  db:
    image: mysql:8.0
    container_name: bolao-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bolao
      MYSQL_USER: user_bolao
      MYSQL_PASSWORD: pass_bolao
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bolao-net

  app:
    build: .
    container_name: bolao-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_NAME=bolao
      - DB_USER=user_bolao
      - DB_PASS=pass_bolao
    depends_on:
      - db
    networks:
      - bolao-net

networks:
  bolao-net:
    driver: bridge

volumes:
  db_data:
