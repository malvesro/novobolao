# ==============================================================================
# CONFIGURAÇÕES PADRÃO DO MÓDULO DE E-MAIL
# ==============================================================================
# Este arquivo contém apenas os valores básicos de fallback.
# Para ambientes de PRODUÇÃO ou CLOUD (Hugging Face), utilize variáveis de ambiente
# ou um arquivo externo (BOLAO_EMAIL_CONFIG) para sobrepor estes valores.
# ==============================================================================

# Seletor de provedor: 'smtp' ou 'brevo'
mail.provider = smtp

# ------------------------------------------------------------------------------
# Configurações para BREVO REST API
# ------------------------------------------------------------------------------
mail.brevo.api.key = 

# ------------------------------------------------------------------------------
# Configurações para SMTP (Google, Outlook, etc)
# ------------------------------------------------------------------------------
mail.smtp.host = localhost
mail.smtp.port = 25
mail.smtp.auth = false
mail.smtp.auth.user = 
mail.smtp.auth.password = 
mail.smtp.starttls.enable = false
mail.smtp.starttls.required = false
mail.smtp.ssl.enable = false
mail.smtp.ssl.trust = 
mail.smtp.connectiontimeout = 10000
mail.smtp.timeout = 10000
mail.smtp.writetimeout = 10000

# ------------------------------------------------------------------------------
# Configurações Comuns de Mensagem
# ------------------------------------------------------------------------------
mail.from.address = no-reply@exemplo.com
mail.from.name = Sistema Bolao
mail.property.systemurl = http://localhost:8080/bolao

# Lista de administradores que recebem alertas de cadastro (separados por vírgula)
mail.admin.emails = 
