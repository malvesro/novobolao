###### Regras #######
rules.title=Regras do Bolão
rules.intro=Este guia resume como funcionam as apostas, bloqueios e critérios de desempate do bolão Copa 2026.
rules.section.scoring=Pontuação das apostas
rules.item.scoring.exact=6 pontos - acerta o placar exato (gols das duas equipes).
rules.item.scoring.result_bonus=3 pontos - acerta o vencedor/empate e o número de gols de uma das equipes.
rules.item.scoring.result=2 pontos - acerta apenas o resultado (vitória, derrota ou empate).
rules.item.scoring.partial=1 ponto - acerta somente os gols de uma das equipes.
rules.item.scoring.none=0 pontos - demais combinações.
rules.section.deadlines=Prazos e bloqueios
rules.item.deadline.lock=Os palpites ficam disponíveis até 1 hora antes do início de cada partida (hora de referência BRT).
rules.item.deadline.review=Após o encerramento, palpites não podem ser alterados; resultados oficiais podem ser revisados via equipe admin.
rules.item.deadline.timezone=Datas e horários exibidos já estão convertidos para o fuso oficial do bolão (Brasília).
rules.section.tie=Critérios de desempate do ranking
rules.item.tie.breaker=Quando dois ou mais participantes somam a mesma pontuação, aplica-se a ordem abaixo:
rules.item.tie.total_points=Maior quantidade de pontos acumulados nas rodadas anteriores (histórico).
rules.item.tie.full_hits=Maior número de acertos completos (6 pontos).
rules.item.tie.partial_bonus=Maior número de acertos parciais com bônus (3 pontos).
rules.item.tie.alphabetic=Persistindo o empate, ordena-se alfabeticamente pelo nome formatado do participante.
rules.section.goodpractices=Boas práticas e conduta
rules.item.goodpractices.security=Proteja suas credenciais: use senhas fortes e atualize-as periodicamente na tela de Trocar Senha.
rules.item.goodpractices.respect=Respeite os prazos e o espírito esportivo; resultados publicados pela organização são definitivos.
rules.item.goodpractices.support=Dúvidas ou inconsistências devem ser reportadas ao administrador do bolão via canal oficial.

